name: Generate calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '5 17 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lunar calendar library
        run: pip install -r requirements.txt

      - name: Generate today.json
        run: python scripts/generate_calendar.py

      - name: Commit generated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add today.json
          git diff --cached --quiet || git commit -m 'Update calendar data'
          git push
